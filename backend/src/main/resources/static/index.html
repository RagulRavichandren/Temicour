<script>
const API='/api/shipments';const PHONE_VALIDATION='inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" title="Enter a 10-digit phone number"';let shipments=[],regions=[];let current='Dashboard';let reportPeriod='all',customFrom='',customTo='';let reportScope=sessionStorage.getItem('swift-role')==='REGION_ADMIN'?'region':'overall',reportDistrict='',reportRegion='';let portalSubmitting=false,customerView='shipments';let loggedIn=sessionStorage.getItem('swift-admin')==='1';let userRegion=sessionStorage.getItem('swift-region')||'ALL';let username=sessionStorage.getItem('swift-user')||'admin';let userRole=sessionStorage.getItem('swift-role')||'ADMIN';let districtAdmin=userRole==='DISTRICT_ADMIN';let customerBooking=new URLSearchParams(location.search).get('booking');
const THEME_KEY='temicour-theme';
let currentTheme=localStorage.getItem(THEME_KEY)||'light';
function setTheme(theme){const allowed=['light','dark'];const next=allowed.includes(theme)?theme:'light';currentTheme=next;localStorage.setItem(THEME_KEY,next);document.body.setAttribute('data-theme',next);document.querySelectorAll('.themeSelect').forEach(select=>{select.value=next;});}

const statuses=['WAITING_FOR_VERIFICATION','VERIFIED'];

let shipmentMenuOpen=false,selectedReturnTracking='',returnSearch='';
function statusLabel(s){return ({WAITING_FOR_VERIFICATION:'WAITING FOR VERIFY',TO_PAY_WAITING_FOR_VERIFICATION:'WAITING FOR TO-PAY VERIFY',VERIFIED:'VERIFIED',IN_TRANSIT:'IN TRANSIT',RECEIVED:'DISPATCHED',OUT_FOR_DELIVERY:'IN TRANSIT',DELIVERED:'DELIVERED',RETURNED:'RETURN',RETURN_DISPATCHED:'RETURN DISPATCHED',RETURN_RECEIVED:'RETURN RECEIVED'}[s]||'WAITING FOR VERIFY')}
function regionMatches(value,region){return region!=='ALL'&&String(value||'').trim().toLowerCase()===String(region||'').trim().toLowerCase()}
function flowLabel(value){const flow=String(value||'').toUpperCase();return flow==='IMPORT'?'Receive':flow==='EXPORT'?'Send':value}function shipmentTypeLabel(s){if(s.returnReason||String(s.shipmentType||'').toUpperCase()==='RETURN')return 'Return';return flowLabel(viewType(s))}function viewType(s){const returnJourney=Boolean(s.returnReason);if(userRegion==='ALL')return s.shipmentType||'EXPORT';if(returnJourney){if(regionMatches(s.destinationRegion,userRegion))return 'EXPORT';if(regionMatches(s.sourceRegion,userRegion))return 'IMPORT';}else{if(regionMatches(s.sourceRegion,userRegion))return 'EXPORT';if(regionMatches(s.destinationRegion,userRegion))return 'IMPORT';}return s.shipmentType||'IMPORT'}

function scheduledShipments(){return shipments.filter(s=>['WAITING_FOR_VERIFICATION','VERIFIED'].includes(s.status)&&regionMatches(s.sourceRegion,userRegion)&&s.exportDate)}
function shipmentExportDate(s){return String(s.exportDate||'').slice(0,10)}
function exportDateIsFuture(s){if(s.returnReason)return false;const date=shipmentExportDate(s);return Boolean(date)&&date>nowLocal().slice(0,10)}
function sendLaterDue(s){return s.status==='WAITING_FOR_VERIFICATION'&&shipmentExportDate(s)<=nowLocal().slice(0,10)}
function sendLaterDueCount(){return userRole==='REGION_ADMIN'?scheduledShipments().filter(sendLaterDue).length:0}

function reportStart(){const now=new Date();if(reportPeriod==='all')return new Date(-8640000000000000);if(reportPeriod==='custom')return customFrom?new Date(customFrom+'T00:00:00'):new Date(-8640000000000000);if(reportPeriod==='weekly'){const d=new Date(now);d.setDate(now.getDate()-6);d.setHours(0,0,0,0);return d}if(reportPeriod==='yearly')return new Date(now.getFullYear(),0,1);return new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function reportEnd(){if(reportPeriod==='custom')return customTo?new Date(customTo+'T23:59:59.999'):new Date(8640000000000000);return new Date(8640000000000000)}
function reportShipments(){const start=reportStart(),end=reportEnd();return shipments.filter(s=>{const created=new Date(s.createdAt);return !Number.isNaN(created.getTime())&&created>=start&&created<=end})}

function table(arr,selectable=false){
 if(!arr.length)return '<div class="empty">No shipments found.</div>';
 return `<div class="table">${arr.map(s=>{
  const returnJourney=Boolean(s.returnReason);
  const displaySenderName=returnJourney?s.receiverName:s.senderName;
  const displayDestination=returnJourney?s.sourceOffice:s.destination;
  const displayReceiverName=returnJourney?s.senderName:s.receiverName;
  const displayReceiverPhone=returnJourney?s.senderPhone:s.receiverPhone;

  const canDelete=userRole==='REGION_ADMIN'&&s.status==='WAITING_FOR_VERIFICATION'&&regionMatches(s.sourceRegion,userRegion);
  const canEdit=userRole==='REGION_ADMIN'&&regionMatches(s.sourceRegion,userRegion)&&(s.status==='WAITING_FOR_VERIFICATION'||(current==='Export'&&s.status==='VERIFIED'));
  const canUpdate=userRole==='REGION_ADMIN';
  const canPrintToPay=current==='Export'&&!returnJourney&&String(s.paymentType||'PAID').toUpperCase()==='TO_PAY'&&userRegion===s.sourceRegion;
  return `<div class="row"><div>${eligible?`<input class="shipmentPick" data-return-journey="${returnJourney}" type="checkbox" value="${esc(s.trackingNumber)}">`:''}<b>${esc(s.trackingNumber)}</b><span>${esc(displaySenderName||'Walk-in customer')} · ${esc(shipmentTypeLabel(s))}</span><span>Entry: ${esc(s.shipmentDate?new Date(s.shipmentDate).toLocaleString():'-')}</span></div><div><b>${esc(displayDestination||'-')}</b><span>${esc(displayReceiverName||'')}</span><span>Mobile: ${esc(displayReceiverPhone||'-')}</span></div><div><span>${esc(s.creationType||'-')}</span><span>Send: ${esc(s.exportDate?new Date(s.exportDate).toLocaleString():'-')}</span><span>${esc(s.weight||'-')} kg · ₹${esc(s.shipmentAmount??'-')}</span></div><div><span class="badge">${esc(statusLabel(s.status))}</span><span>Payment: ${esc(s.paymentType||'PAID')}</span></div><div>${selectable||!statuses.includes(s.status)||!canUpdate?`<span>${esc(statusLabel(s.status))}</span>`:`<select aria-label="Status for ${esc(s.trackingNumber)}" onchange="updateStatus('${esc(s.trackingNumber)}',this.value)">${statuses.map(st=>`<option value="${st}" ${st===s.status?'selected':''}>${st.replaceAll('_',' ')}</option>`).join('')}</select>`}${canImportVerify?`<button class="btn dark" style="margin-left:8px" onclick="openImportPaymentVerification('${esc(s.trackingNumber)}','${esc(importStatus)}')">Verify received</button>`:''}${canPrintToPay?`<button class="btn light" style="margin-left:8px" onclick="printShipmentInvoiceByTracking('${esc(s.trackingNumber)}')">Print invoice</button>`:''}${canEdit?`<button class="btn light" style="margin-left:8px" onclick="editUnverified('${esc(s.trackingNumber)}')">Edit</button>`:''}${canDelete?`<button class="btn light" style="margin-left:8px" onclick="deleteShipment('${esc(s.trackingNumber)}')">Delete</button>`:''}</div></div>`
 }).join('')}</div>`

function customerAccess(){$('root').innerHTML=`<div class="modal" style="background:linear-gradient(135deg,#101820ee,#18343bee)"><form class="modalBox loginForm" style="max-width:430px" onsubmit="customerLogin(event)"><div class="logo">TC</div><span class="eyebrow">CUSTOMER PORTAL</span><h2>Customer sign in</h2><label>Username<input name="username" placeholder="Enter username" required></label><label style="display:block;margin-top:12px">Password<input name="password" type="password" placeholder="Enter password" required></label><button class="btn dark" style="margin-top:18px;width:100%;justify-content:center">Sign in</button><p style="color:var(--muted);font-size:12px;margin-top:14px">Customer accounts are created by the regional logistics administrator.</p></form></div>`}
async function customerLogin(e){e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries()),r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){toast('Invalid customer credentials');return}const a=await r.json();if(a.role!=='CUSTOMER'){toast('Use a customer account here');return}sessionStorage.setItem('swift-admin','1');sessionStorage.setItem('swift-role','CUSTOMER');sessionStorage.setItem('swift-user',a.username);sessionStorage.setItem('swift-region',a.region);loggedIn=true;userRole='CUSTOMER';username=a.username;userRegion=a.region;loadCustomerShipments()}
function customerScheduledShipments(){return shipments.filter(s=>s.exportDate&&['WAITING_FOR_VERIFICATION','VERIFIED'].includes(String(s.status||'').toUpperCase()))}
function customerDueShipments(){return customerScheduledShipments().filter(s=>String(s.status||'').toUpperCase()==='WAITING_FOR_VERIFICATION'&&!exportDateIsFuture(s))}
function customerShipmentRows(list){return list.length?list.map(s=>`<div class="row" style="grid-template-columns:1.5fr 1.5fr 1.2fr 1fr"><div><b>${esc(s.trackingNumber)}</b><span>${esc(s.senderName||'')}</span></div><div><b>${esc(s.destinationRegion||'-')}</b><span>${esc(s.receiverName||'')}</span><span>Mobile: ${esc(s.receiverPhone||'-')}</span></div><div><span>Send date: ${esc(s.exportDate?new Date(s.exportDate).toLocaleString():'Not scheduled')}</span></div><div><span class="badge">${esc(statusLabel(s.status))}</span><span>Payment: ${esc(s.paymentType||'PAID')}</span></div></div>`).join(''):'<div class="empty">No shipments in this view.</div>'}
function renderCustomerPortal(){const sendLater=customerView==='sendLater',scheduled=customerScheduledShipments(),due=customerDueShipments(),visible=sendLater?scheduled:shipments;$('root').innerHTML=`<div class="app"><main class="main" style="max-width:1100px"><div class="top dashboardTop"><div><span class="eyebrow">CUSTOMER PORTAL</span><h1>Welcome, ${esc(username)}</h1><p>Create shipments and follow every status from one dashboard.</p></div><div class="actions"><button class="btn light" onclick="logout()">Sign out</button><button class="btn dark" onclick="openCustomerPortalBooking()">＋ Create shipment</button></div></div><section class="panel"><div class="panelHead"><div><h3>${sendLater?'Send Later':'My shipments'}</h3><p>${sendLater?'View shipments with a scheduled send date.':'Each shipment updates as the courier team processes it.'}</p></div><div class="actions"><button class="btn ${sendLater?'light':'dark'}" onclick="customerView='shipments';renderCustomerPortal()">My shipments</button><button class="btn ${sendLater?'dark':'light'}" onclick="customerView='sendLater';renderCustomerPortal()">Send Later${scheduled.length?` (${scheduled.length})`:''}</button></div></div>${sendLater&&due.length?`<div class="panel" style="margin-bottom:14px;padding:14px;background:#fff9ed"><b>Due for verification</b><p style="margin:4px 0 0;color:var(--muted)">${due.length} shipment${due.length===1?' has':'s have'} reached its scheduled send date and is waiting for your regional team to verify.</p></div>`:''}${customerShipmentRows(visible)}</section></main></div>`}
function openCustomerPortalBooking(){portalSubmitting=false;$('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modalBox" style="max-width:850px" onsubmit="submitPortalBooking(event)"><div class="modalHead"><div><span class="eyebrow">CUSTOMER SHIPMENT GROUP</span><h2>Create shipments</h2><p style="color:var(--muted)">Enter the sender once, then add the details for each shipment. Each shipment creates one verification-queue entry.</p></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><div class="formGrid"><label>Sender name<input name="senderName" required></label><label>Sender mobile<input name="senderPhone" ${PHONE_VALIDATION} required></label><label class="wide">Sender address<textarea name="senderAddress" required></textarea></label><label>Number of shipments<input name="shipmentCount" type="number" min="1" max="50" value="1" required oninput="renderPortalShipmentRows(this.value)"></label></div><div id="portalShipmentRows" style="margin-top:18px"></div><div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button id="portalSubmitButton" class="btn dark">Create shipments</button></div></form></div>`);renderPortalShipmentRows(1)}
function renderPortalShipmentRows(count){const total=Math.max(1,Math.min(50,Number.parseInt(count,10)||1));const host=$('portalShipmentRows');if(!host)return;host.innerHTML=Array.from({length:total},(_,i)=>`<div class="panel" style="padding:15px;margin-bottom:12px;background:#fbfcfd"><div class="panelHead" style="margin-bottom:10px"><h3>Shipment ${i+1}</h3></div><div class="formGrid"><label>Source region<input name="sourceRegion_${i}" required></label><label>Destination region<input name="destinationRegion_${i}" required></label><label>Shipment category<select name="shipmentCategory_${i}" required><option value="" selected disabled>Select category</option><option>Carton Boxes</option><option>Gunny Bags</option><option>Oil Tins</option><option>Trays Or Cases</option><option>Bundles</option></select></label><label>Payment type<select name="paymentType_${i}"><option value="PAID" selected>PAID</option><option value="TO_PAY">TO_PAY</option></select></label><label>Send date/time<input name="exportDate_${i}" type="datetime-local"></label><label>Receiver name<input name="receiverName_${i}" required></label><label>Receiver mobile<input name="receiverPhone_${i}" ${PHONE_VALIDATION} required></label><label class="wide">Receiver address<textarea name="receiverAddress_${i}" required></textarea></label></div></div>`).join('')}
async function submitPortalBooking(e){e.preventDefault();if(portalSubmitting)return;portalSubmitting=true;const button=$('portalSubmitButton');if(button){button.disabled=true;button.textContent='Creating…'}const form=new FormData(e.target),count=Math.max(1,Math.min(50,Number.parseInt(form.get('shipmentCount'),10)||1)),common={senderName:String(form.get('senderName')||'').trim(),senderPhone:String(form.get('senderPhone')||'').trim(),senderAddress:String(form.get('senderAddress')||'').trim()},created=[];for(let i=0;i<count;i++){const body={...common,sourceRegion:String(form.get('sourceRegion_'+i)||'').trim(),destinationRegion:String(form.get('destinationRegion_'+i)||'').trim(),shipmentCategory:String(form.get('shipmentCategory_'+i)||''),paymentType:String(form.get('paymentType_'+i)||'PAID').trim().toUpperCase(),exportDate:form.get('exportDate_'+i)||null,receiverName:String(form.get('receiverName_'+i)||'').trim(),receiverPhone:String(form.get('receiverPhone_'+i)||'').trim(),receiverAddress:String(form.get('receiverAddress_'+i)||'').trim()};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Customer-Username':username},body:JSON.stringify(body)});if(!r.ok){portalSubmitting=false;toast(created.length?`Created ${created.length} shipment(s), but shipment ${i+1} failed`:'Unable to create shipments');await loadCustomerShipments();return}const shipment=await r.json();printToPayInvoiceIfNeeded(shipment);created.push(shipment.trackingNumber||`Shipment ${i+1}`)}$('modal').remove();alert(`Created ${created.length} shipment(s)\n\nTracking IDs:\n${created.join('\n')}\n\nPAID shipments wait for source verification. TO_PAY shipments skip source verification and move directly into the send/receive flow.`);await loadCustomerShipments()}
function showIntro(){document.body.insertAdjacentHTML('beforeend',`<section class="intro" id="intro"><div class="introContent"><div class="introLogo">TC</div><h1>Temi</h1><p>Smart logistics services, from origin to arrival.</p><button class="btn light" onclick="enterPortal()">Continue to sign in</button></div></section>`);setTimeout(()=>{if($('intro'))enterPortal()},3200)}
function enterPortal(){sessionStorage.setItem('temicour-intro-seen','1');const intro=$('intro');if(!intro){render();return}intro.classList.add('hide');setTimeout(()=>{intro.remove();render()},550)}
async function login(e){e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){toast('Invalid admin credentials');return}const account=await r.json();sessionStorage.setItem('swift-admin','1');sessionStorage.setItem('swift-role',account.role||'ADMIN');sessionStorage.setItem('swift-user',account.username);sessionStorage.setItem('swift-region',account.region);sessionStorage.setItem('swift-district',account.district||'');sessionStorage.setItem('swift-state',account.state||'');username=account.username;userRegion=account.region;userRole=account.role||'ADMIN';districtName=account.district||'';districtState=account.state||'';districtAdmin=userRole==='DISTRICT_ADMIN';reportScope=userRole==='REGION_ADMIN'?'region':'overall';loggedIn=true;load()}
function logout(){sessionStorage.removeItem('swift-admin');sessionStorage.removeItem('swift-role');sessionStorage.removeItem('swift-user');sessionStorage.removeItem('swift-region');sessionStorage.removeItem('swift-district');sessionStorage.removeItem('swift-state');loggedIn=false;userRole='ADMIN';render()}
async function addRegion(e){e.preventDefault();if(userRegion!=='ALL'&&!districtAdmin){toast('Only a district administrator can add region logins');return}const body=Object.fromEntries(new FormData(e.target).entries());const r=await fetch('/api/regions',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Role':districtAdmin?'REGION_ADMIN':'ADMIN','X-Operating-Region':userRegion},body:JSON.stringify(body)});if(!r.ok){toast('Region already exists or is invalid');return}toast('Region login added');e.target.reset();await load();nav('Regions')}
function editRegion(id){const r=regions.find(x=>x.id===id);if(!r)return;$('modal')?.remove();const locationFields=userRegion==='ALL'?`<label>State<input name="state" value="${esc(r.state||'')}"></label><label>Country<input name="country" value="${esc(r.country||'')}"></label>`:`<label>Area<input name="area" value="${esc(r.area||'')}"></label><label>District<input name="district" value="${esc(r.district||'')}" readonly></label><label>State<input name="state" value="${esc(r.state||'')}" readonly></label><label>Country<input name="country" value="${esc(r.country||'')}"></label>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modalBox" onsubmit="saveRegion(event,${id})"><div class="modalHead"><div><span class="eyebrow">LOGIN ADMINISTRATION</span><h2>Edit ${userRegion==='ALL'?'district':'region'} login</h2></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><div class="formGrid"><label>${userRegion==='ALL'?'District':'Region'} name<input name="name" value="${esc(r.name)}" required></label>${userRegion==='ALL'?`<label>Code<input name="code" value="${esc(r.code||'')}" maxlength="8"></label>`:''}${locationFields}<label>Username<input name="username" value="${esc(r.username||'')}" required></label><label>New password<input name="password" type="password" placeholder="Leave blank to keep current"></label></div><div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button class="btn dark">Save changes</button></div></form></div>`)}
async function saveRegion(e,id){e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());const r=await fetch('/api/regions/'+id,{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Role':districtAdmin?'REGION_ADMIN':'ADMIN','X-Operating-Region':userRegion},body:JSON.stringify(body)});if(!r.ok){toast('You can edit only logins you manage');return}$('modal').remove();toast('Region updated');await load();nav('Regions')}
async function deleteRegion(id){if(!confirm('Delete this region login?'))return;const r=await fetch('/api/regions/'+id,{method:'DELETE',headers:{'X-Admin-Role':districtAdmin?'REGION_ADMIN':'ADMIN','X-Operating-Region':userRegion}});if(r.ok){toast('Region deleted');await load();nav('Regions')}else toast('You can delete only logins you manage')}
async function updateAdminProfile(e){e.preventDefault();if(userRegion!=='ALL'){toast('Only the global admin can edit this profile');return}const body=Object.fromEntries(new FormData(e.target).entries());const r=await fetch('/api/auth/admin-profile',{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Role':'ADMIN'},body:JSON.stringify(body)});if(!r.ok){toast(r.status===401?'Current credentials are invalid':'Unable to update admin profile');return}const account=await r.json();username=account.username;sessionStorage.setItem('swift-user',username);toast('Admin profile updated');nav('Profile')}
function filterRows(){const q=($('q')?.value||'').toLowerCase();let filtered=shipments.filter(s=>JSON.stringify(s).toLowerCase().includes(q));if(current==='Import'||current==='Export'){filtered=filtered.filter(s=>viewType(s)===current.toUpperCase()&&s.status!=='WAITING_FOR_VERIFICATION'&&(current!=='Export'||!exportDateIsFuture(s)));$('rows').innerHTML=table(filtered,true)}else $('rows').innerHTML=table(filtered)}
async function updateStatus(t,v){if(v==='VERIFIED'){openVerification(t);return}try{const r=await fetch(API+'/'+encodeURIComponent(t)+'/status?value='+encodeURIComponent(v),{method:'PUT',headers:{'X-Operating-Region':userRegion,'X-Region-Role':'REGION_ADMIN'}});if(!r.ok)throw Error();toast('Shipment status updated');await load()}catch(e){toast('Unable to update status')}}
function openVerification(tracking){$('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modalBox" onsubmit="completeVerification(event,'${esc(tracking)}')"><div class="modalHead"><div><span class="eyebrow">SHIPMENT VERIFICATION</span><h2>Verify shipment</h2></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><p class="eyebrow" style="margin-bottom:12px">Enter the final shipment details to complete verification.</p><div class="formGrid"><label>Weight (kg)<input name="weight" type="number" min="0.01" step="0.01" required autofocus></label><label>Shipment amount<input name="amount" type="number" min="0" step="0.01" required></label></div><div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button class="btn dark">Verify shipment</button></div></form></div>`)}
async function completeVerification(e,t){e.preventDefault();const f=new FormData(e.target),weight=Number(f.get('weight')),amount=Number(f.get('amount'));if(!Number.isFinite(weight)||weight<=0||!Number.isFinite(amount)||amount<0){toast('Enter a valid weight and shipment amount');return}try{const r=await fetch(API+'/'+encodeURIComponent(t)+'/status?value=VERIFIED&weight='+encodeURIComponent(weight)+'&amount='+encodeURIComponent(amount),{method:'PUT',headers:{'X-Operating-Region':userRegion,'X-Region-Role':'REGION_ADMIN'}});if(!r.ok)throw Error();$('modal').remove();toast('Shipment verified');await load()}catch(e){toast('Unable to verify shipment')}}
function openImportPaymentVerification(tracking,status){$('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modalBox" onsubmit="completeImportPaymentVerification(event,'${esc(tracking)}','${esc(status)}')"><div class="modalHead"><div><span class="eyebrow">RECEIVE PAYMENT VERIFICATION</span><h2>Verify received shipment</h2></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><p class="eyebrow" style="margin-bottom:12px">Confirm the received weight and amount before adding it to the destination received amount.</p><div class="formGrid"><label>Weight (kg)<input name="weight" type="number" min="0.01" step="0.01" required autofocus></label><label>Shipment amount<input name="amount" type="number" min="0" step="0.01" required></label></div><div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button class="btn dark">Verify received shipment</button></div></form></div>`)}
async function completeImportPaymentVerification(e,t,status){e.preventDefault();const f=new FormData(e.target),weight=Number(f.get('weight')),amount=Number(f.get('amount'));if(!Number.isFinite(weight)||weight<=0||!Number.isFinite(amount)||amount<0){toast('Enter a valid weight and shipment amount');return}try{const delivered=String(status||'').trim().toUpperCase()==='DELIVERED',endpoint=delivered?API+'/'+encodeURIComponent(t)+'/destination-payment-verification?weight='+encodeURIComponent(weight)+'&amount='+encodeURIComponent(amount):API+'/'+encodeURIComponent(t)+'/status?value=RECEIVED&weight='+encodeURIComponent(weight)+'&amount='+encodeURIComponent(amount),r=await fetch(endpoint,{method:'PUT',headers:{'X-Operating-Region':userRegion,'X-Region-Role':'REGION_ADMIN'}});if(!r.ok)throw Error();$('modal').remove();toast('To-pay shipment verified on receipt');await load()}catch(e){toast('Unable to verify received shipment')}}
 async function deleteShipment(t){if(!confirm('Delete this unverified shipment?'))return;const r=await fetch(API+'/'+encodeURIComponent(t),{method:'DELETE',headers:{'X-Operating-Region':userRegion}});if(!r.ok){toast('Only the shipment region administrator can delete it');return}toast('Unverified shipment deleted');await load()}
 async function bulkStatus(value,returnOnly=false){const selected=[...document.querySelectorAll('.shipmentPick:checked')].filter(x=>x.dataset.returnJourney===String(returnOnly)).map(x=>x.value);if(!selected.length){toast(value==='DELIVERED'?'Select received shipments to deliver':'Select at least one eligible shipment');return}if(!confirm('Change '+selected.length+' selected shipment(s) to '+statusLabel(value)+'?'))return;for(const tracking of selected){const r=await fetch(API+'/'+encodeURIComponent(tracking)+'/status?value='+encodeURIComponent(value),{method:'PUT',headers:{'X-Operating-Region':userRegion,'X-Region-Role':'REGION_ADMIN'}});if(!r.ok){toast(value==='RECEIVED'?'Shipment must be in transit before receiving':value==='RETURN_RECEIVED'?'Only the original source region can receive a returned shipment':value==='DELIVERED'?'Shipment must be received before delivery':value==='RETURN_DISPATCHED'?'Return shipment must be in transit and processed at its original source region':'Unable to update all selected shipments');return}}toast('Selected shipments updated');await load()}
function openBooking(){$('modal')?.remove();const sourceField=`<label>Source region<input name="sourceRegion" value="${esc(userRegion)}" readonly required></label>`;const destinationField=`<label>Destination region<input name="destinationRegion" placeholder="Destination region" required></label>`;const paymentField=`<label>Payment type<select name="paymentType"><option value="PAID" selected>PAID</option><option value="TO_PAY">TO_PAY</option></select></label>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modalBox" onsubmit="createBooking(event)"><div class="modalHead"><div><span class="eyebrow">MANUAL BOOKING</span><h2>Create verified shipment</h2></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><p class="eyebrow" style="margin-bottom:12px">Regional manual entries are verified immediately. TO_PAY shipments skip source verification and move directly into the send/receive flow.</p><div class="formGrid">${sourceField}${destinationField}${paymentField}<label>Entry date/time<input name="shipmentDate" type="datetime-local" required></label><label>Send date/time<input name="exportDate" type="datetime-local"></label><label>Sender name<input name="senderName" required></label><label>Sender phone<input name="senderPhone" ${PHONE_VALIDATION} required></label><label>Receiver name<input name="receiverName" required></label><label>Receiver phone<input name="receiverPhone" ${PHONE_VALIDATION} required></label><label>Weight (kg)<input name="weight" type="number" min="0.01" step="0.01" required></label><label>Shipment amount<input name="shipmentAmount" type="number" min="0" step="0.01" required></label><label class="wide">Sender address<textarea name="senderAddress" required></textarea></label><label class="wide">Receiver address<textarea name="receiverAddress" required></textarea></label><label>Source office<input name="sourceOffice" value="Madurai Main Office"></label><label>Destination<input name="destination" value="Chennai" required></label><label>Dimensions<input name="dimensions" value="30 x 20 x 15 cm"></label><label class="wide">Package description<input name="packageDescription" placeholder="Documents, electronics, clothing..."></label></div><div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button class="btn dark">Create shipment</button></div></form></div>`)}
function openCustomerCreation(){$('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modalBox" style="max-width:860px" onsubmit="buildCustomerShipments(event)"><div class="modalHead"><div><span class="eyebrow">CUSTOMER CREATION</span><h2>Start customer shipment order</h2><p style="color:var(--muted)">Enter the sender once, then add route and receiver details for each shipment.</p></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><div class="formGrid"><label>Sender name<input name="senderName" required></label><label>Sender mobile<input name="senderPhone" required></label><label class="wide">Sender address<textarea name="senderAddress" required></textarea></label><label>Number of shipments<input name="count" type="number" min="1" max="25" value="1" required></label></div><div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button class="btn dark">Enter shipment details</button></div></form></div>`)}
function buildCustomerShipments(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries()),count=Math.min(25,Math.max(1,Number(data.count)||1));let rows='';for(let i=1;i<=count;i++)rows+=`<div class="panel" style="margin:0 0 10px;padding:14px"><b>Shipment ${i}</b><div class="formGrid" style="margin-top:10px"><label>Source region<input name="sourceRegion_${i}" value="${esc(userRegion)}" readonly required></label><label>Destination region<input name="destinationRegion_${i}" required></label>${shipmentCategoryField('shipmentCategory_'+i)}<label>Send date/time<input name="exportDate_${i}" type="datetime-local"></label><label>Receiver name<input name="receiverName_${i}" required></label><label>Receiver mobile<input name="receiverPhone_${i}" ${PHONE_VALIDATION} required></label><label class="wide">Receiver address<textarea name="receiverAddress_${i}" required></textarea></label><label>Destination<input name="destination_${i}" required></label><label>Package description<input name="packageDescription_${i}"></label></div></div>`;$('modal').innerHTML=`<form class="modalBox" style="max-width:860px" onsubmit="submitCustomerShipments(event)"><div class="modalHead"><div><span class="eyebrow">CUSTOMER CREATION</span><h2>Shipment details (${count})</h2><p style="color:var(--muted)">All entries will wait in the Verification queue.</p></div><button type="button" class="close" onclick="$('modal').remove()">×</button></div><input type="hidden" name="senderName" value="${esc(data.senderName)}"><input type="hidden" name="senderPhone" value="${esc(data.senderPhone)}"><input type="hidden" name="senderAddress" value="${esc(data.senderAddress)}">${rows}<div class="modalFoot"><button type="button" class="btn light" onclick="$('modal').remove()">Cancel</button><button class="btn dark">Create ${count} shipment${count===1?'':'s'}</button></div></form>`}
async function submitCustomerShipments(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries()),rows=[...e.target.querySelectorAll('input[name^="destinationRegion_"]')],created=[];for(const row of rows){const i=row.name.split('_')[1],body={senderName:data.senderName,senderPhone:data.senderPhone,senderAddress:data.senderAddress,sourceRegion:data['sourceRegion_'+i],destinationRegion:data['destinationRegion_'+i],shipmentCategory:data['shipmentCategory_'+i],exportDate:data['exportDate_'+i]||null,receiverName:data['receiverName_'+i],receiverPhone:data['receiverPhone_'+i],receiverAddress:data['receiverAddress_'+i],destination:data['destination_'+i],packageDescription:data['packageDescription_'+i]};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Operating-Region':userRegion},body:JSON.stringify(body)});if(!r.ok){toast('Could not create shipment '+i);return}created.push(await r.json())}$('modal').innerHTML=`<div class="modalBox" style="max-width:560px"><span class="eyebrow">CUSTOMER SHIPMENTS CREATED</span><h2>Waiting for verification</h2><p style="color:var(--muted)">Share these tracking IDs with the customer.</p><div class="panel">${created.map(s=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(s.trackingNumber)}</b><span style="display:block;color:var(--muted);font-size:12px">${esc(s.sourceRegion)} → ${esc(s.destinationRegion)} · WAITING FOR VERIFY</span></div>`).join('')}</div><div class="modalFoot"><button type="button" class="btn dark" onclick="$('modal').remove();load()">Done</button></div></div>`}

function reportIsImport(shipment){return ['RECEIVED','DELIVERED'].includes(String(shipment.status||'').trim().toUpperCase())}
function reportIsExport(shipment){return ['VERIFIED','IN_TRANSIT','RECEIVED','DELIVERED'].includes(String(shipment.status||'').trim().toUpperCase())}

iv class="actions" style="margin-bottom:15px"><button class="btn light" onclick="reportDrill('overall','')">← All districts</button>${regionMode?`<button class="btn light" onclick="reportDrill('district','${esc(reportDistrict).replaceAll("'","\\'")}')">← Back to district</button>`:''}</div>`:''}${districtTotals?`<div class="stats"><div class="stat"><span>Total received</span><strong>${districtTotals.imports}</strong><small>Across managed regions</small></div><div class="stat"><span>Total sent</span><strong>${districtTotals.exports}</strong><small>Across managed regions</small></div><div class="stat"><span>Total shipments</span><strong>${districtTotals.totalCount}</strong><small>Received + sent movements</small></div><div class="stat"><span>Total amount</span><strong>&#8377;${districtTotals.totalAmount.toFixed(2)}</strong><small>Received + sent amounts</small></div></div>`:''}<div class="reportGrid">${visibleCards.join('')||'<div class="empty">No report data available for this period.</div>'}</div></section>`}

function downloadReport(){const scoped=reportShipments(),rows=[['Level','Name','Received count','Send count','Total count','Received amount (TO_PAY)','Sent amount (PAID)','Total amount','Period']],addRow=(level,name,regionNames)=>{const m=reportMetrics(scoped,regionNames);rows.push([level,name,m.imports,m.exports,m.totalCount,m.importAmount.toFixed(2),m.exportAmount.toFixed(2),m.totalAmount.toFixed(2),reportPeriod])};if(userRole==='ADMIN'){if(reportScope==='overall')reportDistrictAccounts().forEach(d=>addRow('District',d.name,reportRegionsForDistrict(d.name)));else if(reportScope==='district')reportRegionsForDistrict(reportDistrict).forEach(name=>addRow('Region',name,[name]));else addRow('Region',reportRegion||userRegion,[reportRegion||userRegion])}else if(userRole==='DISTRICT_ADMIN'){const names=regions.filter(r=>String(r.accountType||'REGION').toUpperCase()!=='DISTRICT').map(r=>r.name).filter(Boolean);addRow('District total',userRegion,names);names.forEach(name=>addRow('Region',name,[name]))}else addRow('Region',userRegion,[userRegion]);const csv='\uFEFF'+rows.map(row=>row.map(value=>`"${String(value).replaceAll('"','""')}"`).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='temicour-'+reportPeriod+'-report.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function applyPaymentPresentation(node){
 const displayText=text=>text.replace(/\bTO_PAY\b/gi,'UNPAID').replace(/\bTO-PAY\b/gi,'UNPAID');
 if(node.nodeType===Node.TEXT_NODE){if(!node.parentElement?.closest('script,style'))node.nodeValue=displayText(node.nodeValue);return}
 if(node.nodeType!==Node.ELEMENT_NODE||node.closest('script,style'))return;
 const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
 let textNode;while((textNode=walker.nextNode()))textNode.nodeValue=displayText(textNode.nodeValue);
 const selects=[];if(node.matches('select[name^="paymentType"]'))selects.push(node);selects.push(...node.querySelectorAll('select[name^="paymentType"]'));
 for(const select of selects){if(select.dataset.paymentPlaceholderReady)continue;const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='SELECT';placeholder.disabled=true;select.insertBefore(placeholder,select.firstChild);for(const option of select.options)option.removeAttribute('selected');placeholder.selected=true;select.value='';select.required=true;select.dataset.paymentPlaceholderReady='true'}
}
new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(applyPaymentPresentation))).observe(document.body,{childList:true,subtree:true});
load();
